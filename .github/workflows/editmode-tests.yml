# 每天 02:00（Asia/Shanghai）以及手动触发。不是分支保护的必需检查。
#
# 定时任务先看 UNITY_LICENSE 是否为空：空则跳过，避免没有许可证时每晚失败。
# 手动 Run workflow 仍会进入 Unity 激活；没有 Secret 时在激活阶段失败。本仓库不提供许可证。
#
# 需要的仓库 Secret（见 https://game.ci/docs/github/activation ）：
#   UNITY_LICENSE   .ulf 许可证文件的全文
#   UNITY_EMAIL     Unity 账号邮箱
#   UNITY_PASSWORD  Unity 账号密码
#
# Unity 版本与 ProjectSettings/ProjectVersion.txt 一致：2021.3.21f1。

name: EditMode tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  license:
    name: License present
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  editmode:
    name: Unity EditMode
    needs: license
    if: github.event_name != 'schedule' || needs.license.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2021.3.21f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  playmode:
    name: Unity PlayMode
    needs: license
    if: github.event_name != 'schedule' || needs.license.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2021.3.21f1
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
