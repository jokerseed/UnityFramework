# 每天 02:00（Asia/Shanghai）、指向 main 的 PR，以及手动触发。
# fork PR 不运行需要 Secret 的 Unity 作业；只使用 pull_request，绝不使用 pull_request_target。
# 可信运行缺少 UNITY_LICENSE 时明确失败，不能把跳过测试误当成验证通过。
# 保持为可选检查：未配置许可证时 .NET CI 仍可独立验证引擎无关层。
#
# 需要的仓库 Secret（见 https://game.ci/docs/github/activation ）：
#   UNITY_LICENSE   .ulf 许可证文件的全文
#   UNITY_EMAIL     Unity 账号邮箱
#   UNITY_PASSWORD  Unity 账号密码
#
# Unity 版本与 ProjectSettings/ProjectVersion.txt 一致：2021.3.45f2（tests/Framework.Sim.Tests 会检查两处一致）。
# Library 按 Assets / Packages / ProjectSettings 的哈希缓存，未改动资源时跳过整套导入。

name: Unity tests (license required)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    branches: [main]

# 默认只读。仅执行 Unity 的作业需要创建测试 Check Run。
permissions:
  contents: read

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Require license (fork PRs skipped)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Unity license is configured. Test jobs must still complete successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::UNITY_LICENSE is not configured. Unity EditMode and PlayMode tests were NOT run."
            echo "## Unity tests not verified" >> "$GITHUB_STEP_SUMMARY"
            echo "UNITY_LICENSE is missing. No Unity tests ran. The separate .NET CI does not replace Unity integration tests." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  editmode:
    name: Unity EditMode
    needs: license
    if: needs.license.outputs.enabled == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-editmode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-editmode-
            Library-

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2021.3.45f2
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify non-empty passing NUnit results
        env:
          UNITY_RESULTS_PATH: ${{ steps.tests.outputs.artifactsPath }}
        run: python3 scripts/verify_unity_results.py "$UNITY_RESULTS_PATH"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: error

  playmode:
    name: Unity PlayMode
    needs: license
    if: needs.license.outputs.enabled == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-playmode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-playmode-
            Library-

      - name: Run PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2021.3.45f2
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify non-empty passing NUnit results
        env:
          UNITY_RESULTS_PATH: ${{ steps.tests.outputs.artifactsPath }}
        run: python3 scripts/verify_unity_results.py "$UNITY_RESULTS_PATH"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: error

  package-consumer:
    name: Unity clean package consumer
    needs: license
    if: needs.license.outputs.enabled == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project without demo or commercial Assets
        run: python3 scripts/create_unity_consumer.py Temp/PackageConsumer
      - name: Import packages and run public-API tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Temp/PackageConsumer
          unityVersion: 2021.3.45f2
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify non-empty passing NUnit results
        env:
          UNITY_RESULTS_PATH: ${{ steps.tests.outputs.artifactsPath }}
        run: python3 scripts/verify_unity_results.py "$UNITY_RESULTS_PATH"
      - name: Upload consumer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-package-consumer-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: error
